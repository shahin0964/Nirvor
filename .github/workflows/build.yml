name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_log.txt

      - name: Output errors as annotations if failed
        if: failure()
        run: |
          echo "::error::Gradle build failed!"
          grep -E '(e: |FAILURE:|BUILD FAILED|\* What went wrong:)' build_log.txt | while read -r line; do
            echo "::error::$line"
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: nirvor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
