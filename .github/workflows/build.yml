name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eo pipefail
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            export KEYSTORE_FILE="$GITHUB_WORKSPACE/release.keystore"
            echo "Building Debug and Signed Release APKs..."
            ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build_log.txt
          else
            echo "Building Debug APK (Release keystore secret not set)..."
            ./gradlew assembleDebug --stacktrace 2>&1 | tee build_log.txt
          fi

      - name: Output errors as annotations if failed
        if: failure()
        run: |
          echo "::error::Gradle build failed!"
          grep -E '(e: |FAILURE:|BUILD FAILED|\* What went wrong:)' build_log.txt | while read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nirvor-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: nirvor-release-apk
          path: app/build/outputs/apk/release/*.apk
